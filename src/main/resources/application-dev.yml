spring:
  docker:
    compose:
      file: docker-compose.yml
      enabled: true
      lifecycle-management: start_only
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:8082
          consumer-properties:
            schema.registry.url: http://localhost:8083/
          producer-properties:
            schema.registry.url: http://localhost:8083/
management:
  endpoint:
    beans:
      access: read_only
  endpoints:
    web:
      exposure:
        include: '*'